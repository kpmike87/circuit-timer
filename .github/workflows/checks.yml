name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check JavaScript
        run: |
          node --check app.js
          node --check service-worker.js
          node --check ai-config.js
          node --check exercise-media.js
          node --check tools/generate-exercise-media.mjs
          node --check cloudflare-worker/src/index.js
          node --check cloudflare-worker/src/exercise-library.js
      - name: Check asset-version and DOM invariants
        run: node tools/check-invariants.mjs
      - name: Test workout selection and timer compatibility
        run: node --test tools/workout-generator.test.mjs
